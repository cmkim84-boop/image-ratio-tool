name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pyinstaller
      - name: Make icon
        run: python make_icon.py
      - run: python -m PyInstaller --noconfirm --windowed --onedir --icon assets\icon.ico --add-data "assets;assets" --name ImageRatioTool app.py
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: ImageRatioTool-Setup
          path: installer_output/ImageRatioTool-Setup.exe
